[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scann-rk4-sj"
version = "0.1.0"
description = "RK4 asteroid propagation with Jupiter/Saturn perturbations, light-time correction, and MPCORB.DAT verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "astropy",
]

[project.optional-dependencies]
test = [
    "pytest",
    "astroquery",
]

[tool.setuptools]
packages = ["scann_rk4_sj"]
